[package]
name = "rust-kafka-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[features]
default = ["aws-iam"]
aws-iam = ["dep:aws-config", "dep:aws-credential-types", "dep:aws-sigv4", "dep:aws-types", "dep:base64"]

[dependencies]
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
clap = { version = "4", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
futures-util = "0.3"
prometheus-client = "0.25"
rdkafka = { version = "0.39", features = ["ssl-vendored", "libz-static"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
aws-config = { version = "1", optional = true }
aws-credential-types = { version = "1", optional = true }
aws-sigv4 = { version = "1", optional = true }
aws-types = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
http-body-util = "0.1"
proptest = "1"
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
strip = "debuginfo"
